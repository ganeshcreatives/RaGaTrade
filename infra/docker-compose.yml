services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file before starting}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/v1/auth/google/callback}
      DHAN_API_KEY: ${DHAN_API_KEY:-}
      DHAN_API_SECRET: ${DHAN_API_SECRET:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_REDIRECT_URI: ${DHAN_REDIRECT_URI:-http://localhost:4000/api/v1/dhan/callback}
      DHAN_LOGIN_EMAIL: ${DHAN_LOGIN_EMAIL:-}
      DHAN_TOKEN_ENCRYPTION_KEY: ${DHAN_TOKEN_ENCRYPTION_KEY:-}
      ML_SERVICE_URL: http://ml-service:8000
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml-service: { condition: service_started }
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports: ["5173:80"]
    depends_on: [api]
  ml-service:
    build:
      context: ..
      dockerfile: infra/docker/ml.Dockerfile
    ports: ["8000:8000"]
  market-worker:
    build:
      context: ..
      dockerfile: infra/docker/market.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
  trading-worker:
    build:
      context: ..
      dockerfile: infra/docker/trading.Dockerfile
    restart: unless-stopped
volumes:
  pgdata:
