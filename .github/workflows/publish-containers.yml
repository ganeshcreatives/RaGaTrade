name: Publish Azure Container Apps images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "infra/docker/**"
      - "infra/db/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r services/ml-service/requirements.txt httpx
      - run: python -m unittest discover -s services/ml-service/tests -v
  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
          - image: ml
            dockerfile: infra/docker/ml.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ragatrade-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ragatrade-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
